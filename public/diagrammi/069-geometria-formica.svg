<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img">
  <title>Una figura a forma di T fatta di 5 quadretti. Un punto nero nell'angolo in alto a sinistra segna la partenza della formica.</title>
  <rect x="0" y="0" width="240" height="200" fill="#ffffff"/>
  <!-- figura a T: 3 quadretti in alto, 2 sotto quello in mezzo -->
  <g fill="#06d6a0" stroke="#1a1a2e" stroke-width="2">
    <rect x="60" y="40" width="40" height="40"/>
    <rect x="100" y="40" width="40" height="40"/>
    <rect x="140" y="40" width="40" height="40"/>
    <rect x="100" y="80" width="40" height="40"/>
    <rect x="100" y="120" width="40" height="40"/>
  </g>
  <!-- freccia: la formica parte verso destra -->
  <g stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="72" y1="26" x2="112" y2="26"/>
    <polyline points="104,19 113,26 104,33"/>
  </g>
  <!-- partenza della formica -->
  <circle cx="60" cy="40" r="6" fill="#1a1a2e"/>
</svg>
