<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img">
  <title>Figura A: 4 quadretti in fila. Figura B: 4 quadretti messi a quadrato, 2 sopra e 2 sotto.</title>
  <rect x="0" y="0" width="440" height="160" fill="#ffffff"/>
  <!-- figura A: 4 quadretti in fila -->
  <g fill="#a9b8f5" stroke="#1a1a2e" stroke-width="2">
    <rect x="70" y="40" width="40" height="40"/>
    <rect x="110" y="40" width="40" height="40"/>
    <rect x="150" y="40" width="40" height="40"/>
    <rect x="190" y="40" width="40" height="40"/>
  </g>
  <!-- figura B: 2 sopra e 2 sotto -->
  <g fill="#d6b4e0" stroke="#1a1a2e" stroke-width="2">
    <rect x="290" y="20" width="40" height="40"/>
    <rect x="330" y="20" width="40" height="40"/>
    <rect x="290" y="60" width="40" height="40"/>
    <rect x="330" y="60" width="40" height="40"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
    <text x="150" y="135">A</text>
    <text x="330" y="135">B</text>
  </g>
</svg>
