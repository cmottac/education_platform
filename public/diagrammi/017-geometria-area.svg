<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" role="img">
  <title>Il giardino disegnato su una quadrettatura: un rettangolo di 7 quadrati in lunghezza e 4 quadrati in larghezza. Ogni quadrato misura 1 metro per lato.</title>
  <rect x="0" y="0" width="380" height="220" fill="#ffffff"/>
  <g fill="#06d6a0" stroke="#1a1a2e" stroke-width="2">
    <!-- riga 0 -->
    <rect x="20" y="30" width="40" height="40"/>
    <rect x="60" y="30" width="40" height="40"/>
    <rect x="100" y="30" width="40" height="40"/>
    <rect x="140" y="30" width="40" height="40"/>
    <rect x="180" y="30" width="40" height="40"/>
    <rect x="220" y="30" width="40" height="40"/>
    <rect x="260" y="30" width="40" height="40"/>
    <!-- riga 1 -->
    <rect x="20" y="70" width="40" height="40"/>
    <rect x="60" y="70" width="40" height="40"/>
    <rect x="100" y="70" width="40" height="40"/>
    <rect x="140" y="70" width="40" height="40"/>
    <rect x="180" y="70" width="40" height="40"/>
    <rect x="220" y="70" width="40" height="40"/>
    <rect x="260" y="70" width="40" height="40"/>
    <!-- riga 2 -->
    <rect x="20" y="110" width="40" height="40"/>
    <rect x="60" y="110" width="40" height="40"/>
    <rect x="100" y="110" width="40" height="40"/>
    <rect x="140" y="110" width="40" height="40"/>
    <rect x="180" y="110" width="40" height="40"/>
    <rect x="220" y="110" width="40" height="40"/>
    <rect x="260" y="110" width="40" height="40"/>
    <!-- riga 3 -->
    <rect x="20" y="150" width="40" height="40"/>
    <rect x="60" y="150" width="40" height="40"/>
    <rect x="100" y="150" width="40" height="40"/>
    <rect x="140" y="150" width="40" height="40"/>
    <rect x="180" y="150" width="40" height="40"/>
    <rect x="220" y="150" width="40" height="40"/>
    <rect x="260" y="150" width="40" height="40"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1a1a2e">
    <text x="160" y="22" text-anchor="middle">7 metri</text>
    <text x="312" y="116">4 metri</text>
  </g>
</svg>
