<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img">
  <title>In alto un pezzo a forma di L fatto di 4 quadretti. Sotto, quattro pezzi chiamati A, B, C e D, girati in modi diversi.</title>
  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
  <!-- il pezzo: barra verticale con il piede a destra in basso -->
  <g fill="#06d6a0" stroke="#1a1a2e" stroke-width="2">
    <rect x="230" y="15" width="30" height="30"/>
    <rect x="230" y="45" width="30" height="30"/>
    <rect x="230" y="75" width="30" height="30"/>
    <rect x="260" y="75" width="30" height="30"/>
  </g>
  <text x="215" y="66" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a2e">Il pezzo</text>
  <!-- i quattro pezzi da confrontare -->
  <g fill="#a9b8f5" stroke="#1a1a2e" stroke-width="2">
    <!-- A -->
    <rect x="72" y="125" width="30" height="30"/>
    <rect x="72" y="155" width="30" height="30"/>
    <rect x="72" y="185" width="30" height="30"/>
    <rect x="42" y="185" width="30" height="30"/>
    <!-- B -->
    <rect x="152" y="140" width="30" height="30"/>
    <rect x="182" y="140" width="30" height="30"/>
    <rect x="212" y="140" width="30" height="30"/>
    <rect x="182" y="170" width="30" height="30"/>
    <!-- C -->
    <rect x="277" y="140" width="30" height="30"/>
    <rect x="307" y="140" width="30" height="30"/>
    <rect x="337" y="140" width="30" height="30"/>
    <rect x="277" y="170" width="30" height="30"/>
    <!-- D -->
    <rect x="402" y="140" width="30" height="30"/>
    <rect x="432" y="140" width="30" height="30"/>
    <rect x="462" y="140" width="30" height="30"/>
    <rect x="462" y="170" width="30" height="30"/>
  </g>
  <!-- lettere -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
    <text x="72" y="246">A</text>
    <text x="197" y="246">B</text>
    <text x="322" y="246">C</text>
    <text x="447" y="246">D</text>
  </g>
</svg>
