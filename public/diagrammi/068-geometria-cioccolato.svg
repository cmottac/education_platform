<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img">
  <title>Due tavolette di cioccolato a quadretti: quella di Anna ha 3 righe da 4 quadretti, quella di Marco ha 2 righe da 6 quadretti.</title>
  <rect x="0" y="0" width="520" height="200" fill="#ffffff"/>
  <!-- tavoletta di Anna: 3 righe da 4 -->
  <g fill="#8b5a2b" stroke="#d9a066" stroke-width="2">
    <rect x="20" y="20" width="40" height="40"/>
    <rect x="60" y="20" width="40" height="40"/>
    <rect x="100" y="20" width="40" height="40"/>
    <rect x="140" y="20" width="40" height="40"/>
    <rect x="20" y="60" width="40" height="40"/>
    <rect x="60" y="60" width="40" height="40"/>
    <rect x="100" y="60" width="40" height="40"/>
    <rect x="140" y="60" width="40" height="40"/>
    <rect x="20" y="100" width="40" height="40"/>
    <rect x="60" y="100" width="40" height="40"/>
    <rect x="100" y="100" width="40" height="40"/>
    <rect x="140" y="100" width="40" height="40"/>
  </g>
  <!-- tavoletta di Marco: 2 righe da 6 -->
  <g fill="#8b5a2b" stroke="#d9a066" stroke-width="2">
    <rect x="260" y="60" width="40" height="40"/>
    <rect x="300" y="60" width="40" height="40"/>
    <rect x="340" y="60" width="40" height="40"/>
    <rect x="380" y="60" width="40" height="40"/>
    <rect x="420" y="60" width="40" height="40"/>
    <rect x="460" y="60" width="40" height="40"/>
    <rect x="260" y="100" width="40" height="40"/>
    <rect x="300" y="100" width="40" height="40"/>
    <rect x="340" y="100" width="40" height="40"/>
    <rect x="380" y="100" width="40" height="40"/>
    <rect x="420" y="100" width="40" height="40"/>
    <rect x="460" y="100" width="40" height="40"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a2e" text-anchor="middle">
    <text x="100" y="172">Anna</text>
    <text x="380" y="172">Marco</text>
  </g>
</svg>
