<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img">
  <title>Mappa di un parco a quadretti con un laghetto blu nella colonna centrale. La casa è in basso a sinistra, il gelato in basso a destra; si può passare solo dalla riga in alto.</title>
  <rect x="0" y="0" width="240" height="200" fill="#ffffff"/>
  <!-- prato: 5 colonne x 4 righe -->
  <g fill="#d8f8ec" stroke="#1a1a2e" stroke-width="2">
    <rect x="20" y="20" width="40" height="40"/>
    <rect x="60" y="20" width="40" height="40"/>
    <rect x="100" y="20" width="40" height="40"/>
    <rect x="140" y="20" width="40" height="40"/>
    <rect x="180" y="20" width="40" height="40"/>
    <rect x="20" y="60" width="40" height="40"/>
    <rect x="60" y="60" width="40" height="40"/>
    <rect x="140" y="60" width="40" height="40"/>
    <rect x="180" y="60" width="40" height="40"/>
    <rect x="20" y="100" width="40" height="40"/>
    <rect x="60" y="100" width="40" height="40"/>
    <rect x="140" y="100" width="40" height="40"/>
    <rect x="180" y="100" width="40" height="40"/>
    <rect x="20" y="140" width="40" height="40"/>
    <rect x="60" y="140" width="40" height="40"/>
    <rect x="140" y="140" width="40" height="40"/>
    <rect x="180" y="140" width="40" height="40"/>
  </g>
  <!-- laghetto -->
  <g fill="#4361ee" stroke="#1a1a2e" stroke-width="2">
    <rect x="100" y="60" width="40" height="40"/>
    <rect x="100" y="100" width="40" height="40"/>
    <rect x="100" y="140" width="40" height="40"/>
  </g>
  <!-- C = casa, G = gelato -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
    <text x="40" y="168">C</text>
    <text x="200" y="168">G</text>
  </g>
</svg>
