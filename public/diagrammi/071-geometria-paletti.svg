<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img">
  <title>Un righello da 0 a 10 metri. Sono disegnati solo i primi due paletti, a 0 e a 2 metri; il resto del recinto è tratteggiato con un punto di domanda.</title>
  <rect x="0" y="0" width="520" height="160" fill="#ffffff"/>
  <!-- recinto disegnato: traverse tra il paletto a 0 e quello a 2 metri -->
  <g fill="#8b5a2b">
    <rect x="45" y="58" width="78" height="6"/>
    <rect x="45" y="80" width="78" height="6"/>
  </g>
  <!-- resto del recinto, da 2 a 10 metri: tratteggiato -->
  <g stroke="#8b5a2b" stroke-width="4" stroke-dasharray="10 8">
    <line x1="133" y1="61" x2="480" y2="61"/>
    <line x1="133" y1="83" x2="480" y2="83"/>
  </g>
  <!-- i primi due paletti -->
  <g fill="#8b5a2b" stroke="#1a1a2e" stroke-width="1.5">
    <rect x="35" y="44" width="10" height="66"/>
    <rect x="123" y="44" width="10" height="66"/>
  </g>
  <text x="306" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#7b2d8b" text-anchor="middle">?</text>
  <!-- righello: 44 px per metro -->
  <g stroke="#1a1a2e" stroke-width="2">
    <line x1="40" y1="110" x2="480" y2="110"/>
    <line x1="40" y1="104" x2="40" y2="116"/>
    <line x1="84" y1="104" x2="84" y2="116"/>
    <line x1="128" y1="104" x2="128" y2="116"/>
    <line x1="172" y1="104" x2="172" y2="116"/>
    <line x1="216" y1="104" x2="216" y2="116"/>
    <line x1="260" y1="104" x2="260" y2="116"/>
    <line x1="304" y1="104" x2="304" y2="116"/>
    <line x1="348" y1="104" x2="348" y2="116"/>
    <line x1="392" y1="104" x2="392" y2="116"/>
    <line x1="436" y1="104" x2="436" y2="116"/>
    <line x1="480" y1="104" x2="480" y2="116"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="middle">
    <text x="40" y="136">0</text>
    <text x="84" y="136">1</text>
    <text x="128" y="136">2</text>
    <text x="172" y="136">3</text>
    <text x="216" y="136">4</text>
    <text x="260" y="136">5</text>
    <text x="304" y="136">6</text>
    <text x="348" y="136">7</text>
    <text x="392" y="136">8</text>
    <text x="436" y="136">9</text>
    <text x="480" y="136">10</text>
    <text x="260" y="156">metri</text>
  </g>
</svg>
