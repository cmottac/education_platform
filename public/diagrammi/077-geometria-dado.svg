<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" role="img">
  <title>Lo sviluppo di un dado a forma di croce: in alto 1; nella riga in mezzo 2, 3 e 5; sotto 6 e poi 4.</title>
  <rect x="0" y="0" width="240" height="320" fill="#ffffff"/>
  <!-- sviluppo a croce: quadrati da 60 px -->
  <g fill="#ffffff" stroke="#1a1a2e" stroke-width="2">
    <rect x="90" y="40" width="60" height="60"/>
    <rect x="30" y="100" width="60" height="60" fill="#ffd166"/>
    <rect x="90" y="100" width="60" height="60"/>
    <rect x="150" y="100" width="60" height="60"/>
    <rect x="90" y="160" width="60" height="60"/>
    <rect x="90" y="220" width="60" height="60"/>
  </g>
  <!-- numeri delle facce -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
    <text x="120" y="80">1</text>
    <text x="60" y="140">2</text>
    <text x="120" y="140">3</text>
    <text x="180" y="140">5</text>
    <text x="120" y="200">6</text>
    <text x="120" y="260">4</text>
  </g>
</svg>
