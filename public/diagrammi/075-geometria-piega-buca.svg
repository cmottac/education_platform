<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img">
  <title>Un foglio quadrato piegato a metà, poi ancora a metà, poi bucato una volta; l'ultimo disegno è il foglio riaperto con un punto di domanda.</title>
  <rect x="0" y="0" width="560" height="180" fill="#ffffff"/>
  <!-- fogli -->
  <g fill="#fff1c7" stroke="#1a1a2e" stroke-width="2">
    <!-- 1: foglio intero -->
    <rect x="15" y="20" width="120" height="120"/>
    <!-- 2: foglio piegato a metà -->
    <rect x="191" y="20" width="60" height="120"/>
    <!-- 3: foglio piegato ancora a metà -->
    <rect x="307" y="50" width="60" height="60"/>
    <!-- 4: foglio riaperto -->
    <rect x="423" y="20" width="120" height="120"/>
  </g>
  <!-- linee di piega tratteggiate -->
  <g stroke="#4361ee" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="75" y1="20" x2="75" y2="140"/>
    <line x1="191" y1="80" x2="251" y2="80"/>
  </g>
  <!-- il buco -->
  <circle cx="337" cy="80" r="7" fill="#1a1a2e"/>
  <!-- frecce tra un disegno e l'altro -->
  <g stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="145" y1="80" x2="181" y2="80"/>
    <polyline points="173,73 182,80 173,87"/>
    <line x1="261" y1="80" x2="297" y2="80"/>
    <polyline points="289,73 298,80 289,87"/>
    <line x1="377" y1="80" x2="413" y2="80"/>
    <polyline points="405,73 414,80 405,87"/>
  </g>
  <!-- punto di domanda sul foglio riaperto -->
  <text x="483" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#7b2d8b">?</text>
  <!-- didascalie -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="middle">
    <text x="75" y="165">piega</text>
    <text x="221" y="165">piega ancora</text>
    <text x="337" y="165">un buco</text>
    <text x="483" y="165">apri</text>
  </g>
</svg>
